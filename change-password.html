    <script>
        (function () {
            var form = document.getElementById('change-password-form');
            if (!form) return;
            var msg = document.getElementById('password-message');
            // The eye icon toggle is handled globally by assets/js/main.js (.toggle-password)
            function show(text, type) { msg.textContent = text; msg.className = 'form-message ' + type; }
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var cur = document.getElementById('current-password').value;
                var next = document.getElementById('new-password').value;
                var conf = document.getElementById('confirm-password').value;
                if (!cur || !next || !conf) { show('Please fill in all fields.', 'error'); return; }
                if (next.length < 8) { show('New password must be at least 8 characters.', 'error'); return; }
                if (next !== conf) { show('New password and confirmation do not match.', 'error'); return; }
                if (next === cur) { show('New password must be different from the current one.', 'error'); return; }
                show('Your password has been updated.', 'success');
                form.reset();
            });
        })();
    </script>
