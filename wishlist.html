    <style>
        /* Wishlist table: same layout, softer card-style rows */
        .wishlist-page { background: #f8f5ed; }
        .wishlist-page .cart-list-area .table-responsive { padding: 4px; }
        .wishlist-page .common-table { border-collapse: separate; border-spacing: 0; }
        .wishlist-page .common-table thead tr {
            background: var(--header);
            border: 0;
            border-radius: 50px;
            padding: 16px 30px;
            margin-bottom: 18px;
        }
        .wishlist-page .common-table thead tr th { color: #fff; font-size: 16px; font-weight: 600; padding: 0; letter-spacing: .3px; }
        .wishlist-page .common-table tbody tr {
            align-items: center;
            background: #fff;
            border: 0;
            border-radius: 18px;
            padding: 14px 30px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .06);
            transition: transform .3s, box-shadow .3s;
        }
        .wishlist-page .common-table tbody tr:hover { transform: translateY(-3px); box-shadow: 0 16px 38px rgba(0, 0, 0, .1); }
        .wishlist-page .common-table tbody tr td { padding: 0; }
        .wishlist-page .cart-item-thumb img { width: 86px !important; height: 86px; object-fit: contain; background: #f4f1ea; border-radius: 14px; padding: 8px; }
        .wishlist-page .cart-item-thumb > i {
            flex: none;
            width: 32px; height: 32px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: #fdecec; color: #e5383b; font-size: 13px;
            cursor: pointer; transition: .3s;
        }
        .wishlist-page .cart-item-thumb > i:hover { background: #e5383b; color: #fff; }
        .wishlist-page .common-table .price-usd { color: var(--theme2); font-size: 19px; font-weight: 700; }
        .wishlist-page .quantity { border-radius: 50px; background: #faf8f3; }
        .wishlist-page .add-carts-btns { border-radius: 50px; }
    </style>
</head>

                                            <td>
